<!doctype html>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <style type="text/tailwindcss">
      @font-face {
        font-family: "Roboto";
        src: url(Roboto-VariableFont_wdth\,wght.ttf);
      }

      @theme {
        --color-primary: #76C0EC;
        --color-secondary: #22396F;
        --font-roboto: Roboto;
      }

      /* Custom scrollbar for the messages card to match your theme */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(21, 55, 13, 0.1); /* secondary color with opacity */
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #15370d; /* secondary color */
        border-radius: 10px;
      }
    </style>
  </head>

        </div>

    <section class="px-6 md:px-20 py-16 flex flex-col items-center">
      <!-- Video Heading -->
